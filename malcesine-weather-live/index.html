
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Malcesine Weather – 5 Day Forecast</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 40px;
      display: flex;
      justify-content: center;
    }
    #weather-widget-container {
      max-width: 760px;
      width: 100%;
      padding: 24px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
      transition: all 0.3s ease;
      border: 1px solid #ddd;
    }
    #weather-widget-container:hover {
      box-shadow: 0 0 20px rgba(255, 165, 0, 0.4);
      transform: scale(1.01);
    }
    h3 {
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    #weather-widget {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .weather-card {
      flex: 1 1 100px;
      text-align: center;
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
      transition: 0.3s ease;
      cursor: default;
    }
    .weather-card:hover {
      box-shadow: 0 0 10px rgba(255, 165, 0, 0.4);
      transform: scale(1.04);
    }
    .weather-card img {
      width: 50px;
      height: 50px;
    }
    .day {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 8px;
    }
    .temp {
      font-size: 18px;
      font-weight: 500;
    }
    .desc {
      font-size: 13px;
      color: #777;
    }
  </style>
</head>
<body>
  <div id="weather-widget-container">
    <h3>Malcesine Weather – 5 Day Forecast</h3>
    <div id="weather-widget"></div>
  </div>

  <script>
    const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

    fetch("/.netlify/functions/weather")
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById("weather-widget");
        container.innerHTML = "";

        const daily = {};

        data.list.forEach(entry => {
          const date = new Date(entry.dt * 1000);
          const day = date.getDate();
          const hour = date.getHours();
          if (hour === 12 && !daily[day]) {
            daily[day] = entry;
          }
        });

        const days = Object.values(daily).slice(0, 5);

        days.forEach(entry => {
          const date = new Date(entry.dt * 1000);
          const weekday = dayNames[date.getDay()];
          const temp = Math.round(entry.main.temp);
          const icon = entry.weather[0].icon;
          const desc = entry.weather[0].description;

          const card = document.createElement("div");
          card.className = "weather-card";

          card.innerHTML = `
            <div class="day">${weekday}</div>
            <img src="https://openweathermap.org/img/wn/${icon}@2x.png" alt="${desc}">
            <div class="temp">${temp}°C</div>
            <div class="desc">${desc}</div>
          `;

          container.appendChild(card);
        });
      })
      .catch(error => {
        document.getElementById("weather-widget").innerHTML = "<p style='color:#999;'>Weather data not available.</p>";
        console.error("Weather API error:", error);
      });
  </script>
</body>
</html>
